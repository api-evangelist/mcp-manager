aid: mcp-manager
name: MCP Manager
description: >-
  MCP Manager, by Usercentrics, is an enterprise governance and security layer for the
  Model Context Protocol (MCP). It sits as a governed gateway between AI clients (Claude,
  ChatGPT, Cursor, and custom agents) and MCP servers — SaaS tools, internal databases,
  and custom servers — authenticating every request, brokering per-user or shared
  identities, inspecting traffic against gateway rules (regex, Microsoft Presidio, and
  custom rule engines) for PII and prompt-injection defense, provisioning tool allowlists,
  and logging every call with full attribution plus OpenTelemetry export to any SIEM. It
  ships an Admin API and MCP server (closed beta) that manage servers, gateways,
  identities, hosts, teams, roles, and logs over both MCP tools and a REST twin.

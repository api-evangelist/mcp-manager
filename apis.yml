apis:
- name: MCP Manager Admin API
  description: >-
    Control-plane surface that lets an agent or script manage MCP Manager configuration —
    servers, gateways, identities, hosts, teams, roles, logs, and integrations — with the
    same actions as the app, scoped by role capabilities. 64 operations across seven domains,
    each defined once and generated into both an MCP tool and a REST endpoint under
    /api/v1/mcpm-admin. Closed beta (entitlement ff-mcpm-admin).
  humanURL: https://docs.mcpmanager.ai/admin-api/overview

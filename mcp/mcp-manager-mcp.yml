method: searched
status: published
source: https://docs.mcpmanager.ai/admin-api/overview.md
notes: MCP Manager publishes two first-party MCP servers. (1) The Admin (control-plane) MCP server exposes
  64 operations across seven domains; every operation is defined once and generated into BOTH an MCP tool
  and a REST endpoint under /api/v1/mcpm-admin, so the two surfaces never diverge. It is in CLOSED BETA,
  gated by the workspace entitlement ff-mcpm-admin, and the Connect URL is per-workspace. (2) A public
  docs MCP server serves the documentation to agents (no auth).
servers:
- name: MCP Manager Admin
  transport: http
  url: per-workspace Connect URL (Settings -> MCP & API); REST twin at https://<host>/api/v1/mcpm-admin
  availability: closed-beta
  entitlement: ff-mcpm-admin
  auth:
  - Personal Access Token (Authorization: Bearer mcpm_pat_...)
  - OAuth 2.1 (audience-bound per RFC 8707; protected-resource metadata per RFC 9728)
  authorization: per-operation capability gating (same capability as the equivalent app action)
  annotations: tools carry Read-only / Destructive badges; list/query return thin results by default
- name: MCP Manager Docs
  transport: http
  url: hosted docs MCP server (public, no authentication)
  availability: public
  source: https://docs.mcpmanager.ai/get-started/use-docs-with-ai.md
